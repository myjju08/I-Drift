# Live MAE256 settings from 2026-09-10; paths resolve relative to this repository.
# Run through python -m experiments.mae.runtime (see experiments/mae/README.md).
logging:
  project: Feature encoder - S4 model
  entity: a01065522071-kaist-digital-humanities-and-social-science
  name: S4 / MAE256 / same-cache control / scratch / CFG1-2-3
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false
env:
  imagenet_path: data/imagenet/raw_ilsvrc2012
  cache_path: data/imagenet/latent_cache_256_mae_gan_20260910
dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  cache_format: packed_npy_latents_v1
  num_classes: 1000
  batch_size: 4
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true
model:
  cond_dim: 384
  input_size: 32
  in_channels: 4
  patch_size: 4
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false
  use_remat: false
optimizer:
  lr: 0.0004
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000
  lr_schedule: const
train:
  seed: 43
  seed_host_rng: true
  total_steps: 200183
  total_generated_epochs: 40.0
  save_per_step: 5000
  save_per_generated_epochs: 10.0
  eval_per_step: 400000
  eval_per_generated_epochs: 10.0
  eval_samples: 1024
  eval_at_start: true
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 64
  neg_per_sample: 32
  positive_bank_size: 128
  negative_bank_size: 1000
  banks_per_rank: 1
  push_per_step: 128
  loader_batch_size: 128
  push_at_resume: 0
  gen_per_label: 32
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.0
  drift_matching: rev-drift
  R_list:
  - 0.2
  - 0.05
  - 0.02
  rev_drift_affinity_kernel: exponential
  rev_drift_kernel_shape: 1.0
  rev_drift_kernel_adaptive_k_pos: 0
  rev_drift_kernel_adaptive_k_neg: 0
  rev_drift_force_multiplier: 1.0
  rev_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  drift_top_k_groups: all
  layer_temperature_profile: mae_scale_matched
  layer_temperature_profiles:
    uniform:
      default: 1.0
      stage1: 1.0
      stage2: 1.0
      stage3: 1.0
      stage4: 1.0
    mae_scale_matched:
      default: 1.0
      stage3: 1.0
      stage4: 1.0
  feature_loss_profile: no_stage12_norm_x2
  feature_loss_group_normalize: true
  prune_skipped_feature_tensors: true
  feature_loss_profiles:
    no_stage12_norm_x2:
      default: 1.0
      norm_x: 2.0
      stage1: 0.0
      stage2: 0.0
  global_scale_stats: true
  global_fnorm_stats: true
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    active_stages:
    - stage3
    - stage4
    patch_mean_size:
    - 2
    - 4
    patch_std_size:
    - 2
    - 4
    use_std: true
    use_mean: true
    with_global: true
    with_norm_x: true
    every_k_block: 2
    exclude_terminal_block: false
  cfg_list:
  - 1.0
  - 2.0
  - 3.0
  historical_gen_replay: false
  historical_gen_replay_ratio: 0.0
  historical_gen_replay_count: 16
  historical_gen_replay_bank_count: 16
  historical_gen_replay_start_generated_epochs: 10.0
  historical_gen_replay_storage_dtype: float16
  historical_gen_replay_source: frozen_snapshot
  historical_gen_replay_ratio_start: null
  historical_gen_replay_ratio_ramp_start_step: 0
  historical_gen_replay_ratio_ramp_end_step: 0
  historical_gen_current_weight: null
  historical_gen_history_weight: null
  throughput_opt_level: 3
  checkpoint_latest_hardlink: true
feature:
  feature_extractor: mae
  feature_checkpoint: artifacts/mae_latent_256/ckpt_ema.pt
  mae_checkpoint: artifacts/mae_latent_256/ckpt_ema.pt
  mae_use_remat: false
  use_convnext: false
  feature_use_bf16: true
  feature_use_remat: true
  feature_microbatch_size: 16
  feature_spatial_pool: 2
  feature_include_norm_x: true
  feature_clip_decoded_pixels: false
  feature_vae_model_id: artifacts/sd-vae-ft-mse
  feature_vae_revision: null
  feature_adapter: false
  feature_gan: false
  adversarial_mode: none
  adversarial_seed: 43
  adversarial_base_channels: 32
  adversarial_lr: 0.0001
  adversarial_adam_b1: 0.0
  adversarial_adam_b2: 0.99
  adversarial_ema_decay: 0
  adversarial_r1_gamma: 1.0
  adversarial_r1_interval: 16
  adversarial_structure_weight: 0
  adversarial_samples_per_class: 8
  adversarial_d_chunk_size: 8
  adversarial_g_chunk_size: 16
  adversarial_max_grad_norm: 0.0
  adversarial_loss_weight: 0.0
  adversarial_drift_weight: 0.0
  latent_rgb_vae_weights_sha256: a1d993488569e928462932c8c38a0760b874d166399b14414135bd9c42df5815
  latent_rgb_decode_chunk_size: 4
