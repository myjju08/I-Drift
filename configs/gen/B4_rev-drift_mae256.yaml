# Generator training — latent space, B/4 reverse drift + official MAE-256
#
# Matched to B2_rev-drift.yaml. Intentional architecture changes only:
#   1. generator patch_size: 2 -> 4 (32x32 latent grid: 256 -> 64 tokens),
#   2. feature encoder: official mae_latent_640 -> mae_latent_256.
#
# The MAE-256 checkpoint retains input_patch_size=1, so the feature encoder
# still receives the complete 32x32 latent grid. Bank sizes, sample counts,
# optimizer, temperatures, full feature-layer objective, and training schedule
# match the B/2 reverse-drift baseline.

logging:
  project: "ReplayDrift"
  entity: null  # use the account selected by the local W&B login
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/home1/irteam/data-vol1/osilab/hojung/data/imagenet_kaggle/ILSVRC2012"
  cache_path: "/home1/irteam/data-vol1/osilab/hojung/data/image_test/image_latents"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 10
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 4
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false
  use_remat: true

optimizer:
  lr: 0.0004
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 200000
  save_per_step: 5000
  eval_per_step: 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 128
  neg_per_sample: 32
  positive_bank_size: 128
  negative_bank_size: 1000
  banks_per_rank: 1
  push_per_step: 128
  loader_batch_size: 128
  push_at_resume: 0
  gen_per_label: 64
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.0
  drift_matching: "rev-drift"
  # Opt-in detached two-step corrections. "sample" updates generated latents
  # through MAE input gradients and re-encodes them for the second field.
  double_drift_mode: "off"  # off | feature | sample
  double_drift_c0: 0.75
  double_drift_c1: 0.25
  double_drift_sample_step_rms: 0.1  # RMS latent displacement before c0
  # Optional temporal self-repulsion. When enabled, each rank collects a
  # class-conditioned latent snapshot during warmup, freezes it at the chosen
  # generated-sample epoch, and uses it as an additional detached generated
  # repulsion pool. Disabled by default for exact baseline behavior.
  historical_gen_replay: false
  historical_gen_replay_ratio: 0.0
  historical_gen_replay_count: 16
  # Zero means use replay_count. Set this larger when drawing an efficient
  # H-sized subset from a shared snapshot bank with more stored anchors.
  historical_gen_replay_bank_count: 0
  historical_gen_replay_start_generated_epochs: 10.0
  historical_gen_replay_storage_dtype: "float16"
  historical_gen_replay_source: "frozen_snapshot"
  # Memory-management ablations after the snapshot boundary. Rolling policies
  # stream detached candidates already produced by the main generator pass.
  historical_gen_replay_policy: "frozen"
  historical_gen_replay_update_count: 2
  historical_gen_replay_update_interval_steps: 1
  historical_gen_replay_usage_budget: 4
  # Optional linear mass ramp. Null ratio_start preserves a static ratio.
  historical_gen_replay_ratio_start: null
  historical_gen_replay_ratio_ramp_start_step: 0
  historical_gen_replay_ratio_ramp_end_step: 0
  # Optional causal-control overrides. Null preserves the ratio-derived values:
  # current=1-rho and history=rho*G/H. A non-null current weight also works
  # without replay, allowing reduced-current-only controls.
  historical_gen_current_weight: null
  historical_gen_history_weight: null
  R_list: [0.2, 0.05, 0.02]
  # Reverse affinity defaults reproduce the original exponential mutual
  # row/column-softmax loss. Non-exponential kernel ablations override these
  # fields in scripts/run_B4_reverse_kernel_ablation.py.
  rev_drift_affinity_kernel: "exponential"
  rev_drift_kernel_shape: 1.0
  rev_drift_kernel_adaptive_k_pos: 0
  rev_drift_kernel_adaptive_k_neg: 0
  rev_drift_kernel_adaptive_margin: 1.05
  rev_drift_kernel_mix_weight: 0.5
  rev_drift_kernel_temperature_mix: []
  rev_drift_kernel_temperature_mix_weights: []
  rev_drift_force_multiplier: 1.0
  # Static layer-temperature ablations. A profile multiplies all three R
  # values for every objective emitted by that encoder stage. Raw/global
  # input objectives are intentionally unchanged (multiplier 1.0).
  #
  # Select from the launcher with LAYER_TEMPERATURE_PROFILE=<profile>.
  layer_temperature_profile: "uniform"
  layer_temperature_profiles:
    # A0: exact fixed-temperature B/4 reverse-drift control.
    uniform:
      stage1: 1.0
      stage2: 1.0
      stage3: 1.0
      stage4: 1.0
    # A1: isolate broader neighborhoods in shallow encoder features.
    shallow_hot:
      stage1: 1.50
      stage2: 1.0
      stage3: 1.0
      stage4: 1.0
    # A2: isolate sharper neighborhoods in deep semantic features.
    deep_sharp:
      stage1: 1.0
      stage2: 1.0
      stage3: 1.0
      stage4: 0.75
    # A3: combined shallow-to-deep temperature profile.
    depth_profile:
      stage1: 1.50
      stage2: 1.25
      stage3: 1.0
      stage4: 0.75
  # Loss-importance ablations. Zero removes a group after the frozen MAE has
  # emitted all activations. The remaining per-feature coefficients are
  # rescaled to preserve the baseline total coefficient mass (86 objectives
  # with the activation settings below).
  feature_loss_profile: "all"
  feature_loss_group_normalize: true
  prune_skipped_feature_tensors: true
  feature_loss_profiles:
    all:
      default: 1.0
    no_global:
      default: 1.0
      global: 0.0
    no_norm_x:
      default: 1.0
      norm_x: 0.0
    no_stage1:
      default: 1.0
      stage1: 0.0
    no_stage2:
      default: 1.0
      stage2: 0.0
    no_stage3:
      default: 1.0
      stage3: 0.0
    no_stage4:
      default: 1.0
      stage4: 0.0
    # Preserve total coefficient mass while making the direct latent-space
    # objective eight times as important as every surviving MAE objective.
    global_x8:
      default: 1.0
      global: 8.0
    # Efficiency ablations: strengthen the nearly-free input RMS objective
    # while pruning one or both expensive shallow MAE loss groups.
    no_stage1_norm_x2:
      default: 1.0
      norm_x: 2.0
      stage1: 0.0
    no_stage2_norm_x2:
      default: 1.0
      norm_x: 2.0
      stage2: 0.0
    no_stage12:
      default: 1.0
      stage1: 0.0
      stage2: 0.0
    no_stage12_norm_x2:
      default: 1.0
      norm_x: 2.0
      stage1: 0.0
      stage2: 0.0
  # Dense reverse-drift coupling is the default.
  rev_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  # Experimental row-wise targets retained per generated sample.
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  # "all" preserves the original behavior. Efficiency ablations can restrict
  # top-k to MAE stages while leaving cheap input constraints dense.
  drift_top_k_groups: "all"
  global_scale_stats: true
  global_fnorm_stats: true
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    with_global: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/home/irteam/data-vol1/osilab/hojung/dualdrift/weights/pt/mae_latent_256/ckpt_latest.pt"
  mae_use_remat: true
  use_convnext: false
  # Optional real-supervised residual adapters. The online adapters are
  # optimized only with real ImageNet labels; an EMA copy supplies the moving
  # feature metric used by the generator drift loss.
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer3", "layer4"]
  feature_adapter_bottleneck: 64
  feature_adapter_projection_dim: 128
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0001
  feature_adapter_update_freq: 1
  feature_adapter_samples_per_class: 8
  feature_adapter_temp: 0.1
  feature_adapter_reg_lambda: 0.01
  feature_adapter_loss_weight: 1.0
  feature_adapter_ce_weight: 0.1
  feature_adapter_max_grad_norm: 1.0
  feature_adapter_ema_decay: 0.999
  # Optional adversarial regularizer over terminal maps from the frozen MAE.
  # The discriminator reuses the drift feature passes and never updates MAE.
  # Its generator contribution is normalized to a target feature-gradient
  # ratio, avoiding dependence on the raw scale of the two objectives.
  feature_gan: false
  feature_gan_keys: ["layer4"]
  feature_gan_hidden_channels: 128
  feature_gan_real_samples_per_class: 64
  feature_gan_lr: 0.0002
  feature_gan_weight_decay: 0.0001
  feature_gan_adam_b1: 0.0
  feature_gan_adam_b2: 0.9
  feature_gan_discriminator_max_grad_norm: 5.0
  feature_gan_gradient_ratio: 0.10
  feature_gan_warmup_steps: 1000
  feature_gan_gradient_calibration_freq: 10
  feature_gan_gradient_ratio_ema: 0.0
  feature_gan_scale_min: 0.0
  feature_gan_scale_max: 1000.0
  feature_gan_use_bf16: true
