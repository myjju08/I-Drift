# Matched S/4 feature-encoder comparison: MAE temperature reference.

logging:
  project: "Feature encoder - S4 model"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  name: "S4-featurecmp-mae256-g32p64n32-global-normx2-stage34-eval0-10-40ep"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: ""
  cache_path: "data/imagenet/latent_cache_256"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  cache_format: "pt_imagefolder"
  num_classes: 1000
  batch_size: 4
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 384
  input_size: 32
  in_channels: 4
  patch_size: 4
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false
  use_remat: false

optimizer:
  lr: 0.0004
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000
  lr_schedule: "const"

train:
  seed: 43
  seed_host_rng: true
  total_steps: 200183
  total_generated_epochs: 40.0
  save_per_step: 5000
  save_per_generated_epochs: 10.0
  # 1,281,167 train latents / (B=4 x 2 ranks x G=32): 40 epochs = 200,183 steps.
  # The untrained generator is identical across encoders; evaluate at 0/10/20/30/40.
  eval_per_step: 400000
  eval_per_generated_epochs: 10.0
  eval_samples: 1024
  eval_at_start: true
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 64
  neg_per_sample: 32
  positive_bank_size: 128
  negative_bank_size: 1000
  banks_per_rank: 1
  push_per_step: 128
  loader_batch_size: 128
  push_at_resume: 0
  gen_per_label: 32
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.0
  drift_matching: "rev-drift"
  R_list: [0.2, 0.05, 0.02]
  rev_drift_affinity_kernel: "exponential"
  rev_drift_kernel_shape: 1.0
  rev_drift_kernel_adaptive_k_pos: 0
  rev_drift_kernel_adaptive_k_neg: 0
  rev_drift_force_multiplier: 1.0
  rev_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  drift_top_k_groups: "all"
  layer_temperature_profile: "mae_scale_matched"
  layer_temperature_profiles:
    uniform: {default: 1.0, stage1: 1.0, stage2: 1.0, stage3: 1.0, stage4: 1.0}
    # Reference temperatures: tau = R for both active stages.
    mae_scale_matched: {default: 1.0, stage3: 1.0, stage4: 1.0}
  feature_loss_profile: "no_stage12_norm_x2"
  feature_loss_group_normalize: true
  prune_skipped_feature_tensors: true
  feature_loss_profiles:
    no_stage12_norm_x2:
      default: 1.0
      norm_x: 2.0
      stage1: 0.0
      stage2: 0.0
  global_scale_stats: true
  global_fnorm_stats: true
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    active_stages: [stage3, stage4]
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    with_global: true
    with_norm_x: true
    every_k_block: 2
    exclude_terminal_block: false
  cfg_list: [1.0, 2.0, 3.0]
  historical_gen_replay: false
  historical_gen_replay_ratio: 0.0
  historical_gen_replay_count: 16
  historical_gen_replay_bank_count: 16
  historical_gen_replay_start_generated_epochs: 10.0
  historical_gen_replay_storage_dtype: "float16"
  historical_gen_replay_source: "frozen_snapshot"
  historical_gen_replay_ratio_start: null
  historical_gen_replay_ratio_ramp_start_step: 0
  historical_gen_replay_ratio_ramp_end_step: 0
  historical_gen_current_weight: null
  historical_gen_history_weight: null
  throughput_opt_level: 3

feature:
  feature_extractor: "mae"
  feature_checkpoint: "data/imagenet/mae_latent_256/ckpt_latest.pt"
  mae_checkpoint: "data/imagenet/mae_latent_256/ckpt_latest.pt"
  mae_use_remat: false
  use_convnext: false
  feature_use_bf16: true
  feature_use_remat: true
  feature_microbatch_size: 16
  # Pool exported 256px R50 maps by 2 to match MAE grids: 32/32/16/8/4.
  feature_spatial_pool: 2
  feature_include_norm_x: true
  # Matches the upstream differentiable feature path (no output clipping).
  feature_clip_decoded_pixels: false
  feature_vae_model_id: "stabilityai/sd-vae-ft-mse"
  feature_vae_revision: "31f26fdeee1355a5c34592e401dd41e45d25a493"
  feature_adapter: false
  feature_gan: false
